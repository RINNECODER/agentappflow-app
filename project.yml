name: AgentAppFlow
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  AgentAppFlow:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    postBuildScripts:
      - name: Embed Python Runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          /bin/sh "${SRCROOT}/scripts/embed_python_runtime.sh"
    sources:
      - path: App
      - path: python/agentappflow_bootstrap.py
        buildPhase: resources
      - path: python/agentappflow_core/bootstrap.py
        buildPhase: resources
      - path: python/agentappflow_core/runtime.py
        buildPhase: resources
      - path: python/agentappflow_core/storage.py
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinnecoder.agentappflow
        PRODUCT_NAME: AgentAppFlow
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  AgentAppFlowTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/AgentAppFlowTests
    dependencies:
      - target: AgentAppFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
